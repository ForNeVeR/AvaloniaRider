[versions]
kotlin = "2.4.10-RC2"
rdGen = "2026.3.0"
riderSdk = "2026.3-EAP4-SNAPSHOT"
riderSdkPreview = "2026.3-EAP4-SNAPSHOT"

[libraries]
bson4Jackson = "de.undercouch:bson4jackson:2.18.0"
intellij-plugin-verifier-cli = "org.jetbrains.intellij.plugins:verifier-cli:1.410"
junit = "junit:junit:4.13.2"
junit-jupiter = "org.junit.jupiter:junit-jupiter-api:6.1.3"
junit-params = "org.junit.jupiter:junit-jupiter-params:6.1.3"
junit-launcher = "org.junit.platform:junit-platform-launcher:6.1.3"
junit-engine = "org.junit.jupiter:junit-jupiter-engine:6.1.3"
junit-vintage = "org.junit.vintage:junit-vintage-engine:6.1.3"
kotlin-test = { group = "org.jetbrains.kotlin", name = "kotlin-test", version.ref = "kotlin" }
kotlinStdLib = { group = "org.jetbrains.kotlin", name = "kotlin-stdlib", version.ref = "kotlin" }
openTest4J = "org.opentest4j:opentest4j:1.3.0"
rdGen = { group = "com.jetbrains.rd", name = "rd-gen", version.ref = "rdGen" }

[plugins]
changelog = "org.jetbrains.changelog:2.5.0"
gradleJvmWrapper = "me.filippov.gradle.jvm.wrapper:0.16.0"
intelliJPlatform = "org.jetbrains.intellij.platform:2.19.0"
kotlinJvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
