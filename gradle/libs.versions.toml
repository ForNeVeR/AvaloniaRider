[versions]
kotlin = "2.4.0"
rdGen = "2026.2.5"
riderSdk = "2026.2.0.1"
riderSdkPreview = "2026.2.0.1"

[libraries]
bson4Jackson = "de.undercouch:bson4jackson:2.18.0"
intellij-plugin-verifier-cli = "org.jetbrains.intellij.plugins:verifier-cli:1.408"
junit = "junit:junit:4.13.2"
junit-jupiter = "org.junit.jupiter:junit-jupiter-api:5.14.4"
junit-params = "org.junit.jupiter:junit-jupiter-params:5.14.4"
junit-launcher = "org.junit.platform:junit-platform-launcher:1.9.2"
junit-engine = "org.junit.jupiter:junit-jupiter-engine:5.10.2"
junit-vintage = "org.junit.vintage:junit-vintage-engine:5.9.2"
kotlin-test = { group = "org.jetbrains.kotlin", name = "kotlin-test", version.ref = "kotlin" }
kotlinStdLib = { group = "org.jetbrains.kotlin", name = "kotlin-stdlib", version.ref = "kotlin" }
openTest4J = "org.opentest4j:opentest4j:1.3.0"
rdGen = { group = "com.jetbrains.rd", name = "rd-gen", version.ref = "rdGen" }

[plugins]
changelog = "org.jetbrains.changelog:2.5.0"
gradleJvmWrapper = "me.filippov.gradle.jvm.wrapper:0.16.0"
intelliJPlatform = "org.jetbrains.intellij.platform:2.18.1"
kotlinJvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
